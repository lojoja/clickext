version: 2

updates:
  - package-ecosystem: github-actions
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # uv Dependabot does not support group dependency-type
  # https://github.com/dependabot/dependabot-core/issues/13202
  - package-ecosystem: uv
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dev:
        patterns:
          - pytest*
          - ruff
          - ty

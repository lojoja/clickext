[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "clickext"
version = "1.0.6a0"
description = "Extended features for the Python click library"
license = {text = "MIT"}
readme = "README.md"
authors = [
  { name = "lojoja", email = "dev@lojoja.com" }
]
requires-python = ">=3.10,<4"
dependencies = [
  "click==8.*",
  "pyyaml==6.*",
  "tomli==2.*"
]
dynamic = ["classifiers"]

[project.urls]
homepage = "https://github.com/lojoja/clickext"
repository = "https://github.com/lojoja/clickext"
"Bug Tracker" = "https://github.com/lojoja/clickext/issues"

[tool.poetry]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

[tool.poetry.group.dev.dependencies]
black = "^26.1.0"
pylint = "^4.0.4"
pyright = "^1.1.408"
pytest = "^9.0.2"
pytest-cov = ">=4.1,<8.0"
pytest-mock = "^3.15.1"

[tool.black]
include = '\.pyi?$'
line-length = 120
skip-magic-trailing-comma = true

[tool.coverage.run]
source = ["clickext"]
omit = ["tests/"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if log:",
  "if t.TYPE_CHECKING",
]
fail_under = 100
show_missing = true

[tool.pylint.main]
ignore-paths = ["^(.*/)?.venv/.*$", "^(.*/)?dist/.*$"]
load-plugins = ["pylint.extensions.mccabe"]

[tool.pylint.design]
max-complexity = 16

[tool.pylint.format]
max-line-length = 120

[tool.pylint.imports]
allow-reexport-from-package = true

[tool.pyright]
ignore = [".venv/*", "dist/*"]
pythonVersion = "3.10"
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = []
filterwarnings = ["ignore:::.*pytest_cov*"]

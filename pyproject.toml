[project]
name = "clickext"
version = "1.0.6a0"
description = "Extended features for the Python click library"
authors = [{ name = "lojoja", email = "dev@lojoja.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "click==8.*",
  "pyyaml==6.*",
  "tomli==2.*",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=9.0.2,<10",
  "pytest-cov>=7.0.0,<8.0",
  "pytest-mock>=3.15.1,<4",
  "ruff>=0.14.14",
  "ty>=0.0.14",
]

[project.urls]
homepage = "https://github.com/lojoja/clickext"
repository = "https://github.com/lojoja/clickext"
"Bug Tracker" = "https://github.com/lojoja/clickext/issues"

[tool.coverage.report]
exclude_also = [
  "if t.TYPE_CHECKING",
]
fail_under = 100
show_missing = true

[tool.coverage.run]
source = ["src"]
omit = ["tests"]
branch = true

[tool.pytest]
testpaths = ["tests"]
strict_markers = true
markers = []
filterwarnings = []

[tool.ruff]
src = ["src", "tests"]
target-version = "py310"
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812","CPY001", "D203", "D213", "E111", "E114", "E117"]
fixable = ["ALL"]
unfixable = []
mccabe.max-complexity = 15 # 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "FBT001",
  "INP001",
  "PLR0913",
  "PLR0917",
  "S101"
]

[tool.ty]
src.include = ["src", "tests"]
